spring.application.name=SupportTicketManagementSystem
server.servlet.context-path=/api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=qwerty

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=support_ticket

#JWT properties
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=support-ticket-api
app.security.jwt.access-token-ttl-seconds=900